# SECURITY: Replace with strong admin password from secret manager. Do not commit real values.
THIS MANIFEST IS DEPRECATED. DO NOT APPLY DIRECTLY.

Create the grafana-admin secret imperatively with a secure password:
   kubectl create secret generic grafana-admin -n monitoring \
     --from-literal=GF_SECURITY_ADMIN_USER=admin --from-literal=GF_SECURITY_ADMIN_PASSWORD=$(vault kv get -field=password secret/grafana/admin)

Alternatively, use External Secrets Operator or Sealed Secrets for secure runtime injection.
