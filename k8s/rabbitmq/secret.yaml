# SECURITY: RABBITMQ_DEFAULT_USER and RABBITMQ_DEFAULT_PASS must be injected from secret manager.
# Never use default 'guest' username in production. Password must be strong and rotated.
apiVersion: v1
kind: Secret
metadata:
  name: rabbitmq-secret
  namespace: production
type: Opaque
stringData:
  RABBITMQ_DEFAULT_USER: "${RABBITMQ_USER:?RABBITMQ_USER must be set from secret manager}"
  RABBITMQ_DEFAULT_PASS: "${RABBITMQ_PASS:?RABBITMQ_PASS must be set from secret manager}"
