# SECURITY: Least-privilege RBAC configuration.
# Developers get read-only access to production namespace.
# Deployers get limited write access to production deployments/pods only.
# No cluster-wide admin privileges for system:authenticated group.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: developer-readonly-role
  namespace: production
rules:
  - apiGroups: ["*"]
    resources: ["*"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: developer-readonly-binding
  namespace: production
subjects:
  - kind: Group
    name: system:authenticated
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: Role
  name: developer-readonly-role
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: deployer-role
  namespace: production
rules:
  - apiGroups: ["apps", ""]
    resources: ["deployments", "pods", "services", "configmaps"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
---
# RoleBinding for deployer-role should be bound to specific ServiceAccounts
# or Groups, not system:authenticated. Example:
# apiVersion: rbac.authorization.k8s.io/v1
# kind: RoleBinding
# metadata:
#   name: deployer-binding
#   namespace: production
# subjects:
#   - kind: ServiceAccount
#     name: deployer-sa
#     namespace: production
# roleRef:
#   kind: Role
#   name: deployer-role
  apiGroup: rbac.authorization.k8s.io
