# SECURITY: This Secret resource is a template. Real values MUST be injected from an external secret operator
# (e.g., External Secrets Operator, Sealed Secrets, Vault Agent) at deploy time.
#
# DO NOT apply this file directly with kubectl apply. Use a secret management solution.
# CI/CD pipeline MUST reject any Secret containing REPLACE_ME or placeholder credentials.
#
# Required keys: JWT_SECRET, API_KEY, DATABASE_URL (full PostgreSQL connection string).
#
# Example external secret operator integration:
# Use ExternalSecret CRD or sealed-secrets to populate stringData from secret store.
apiVersion: v1
kind: Secret
metadata:
  name: user-service-secret
  namespace: production
  annotations:
    secret-source: "external-secret-operator-required"
type: Opaque
stringData:
  # Placeholder values removed. This Secret MUST be populated by an external secret operator.
  # Direct kubectl apply of this file will result in missing credentials and application failure.
